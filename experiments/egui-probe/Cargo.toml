[package]
name = "getscreenshare-egui-probe"
version = "0.4.0"
edition = "2021"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
livekit = "0.11"
futures-util = "0.3"
cpal = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
nokhwa = { version = "0.10", features = ["input-msmf"] }
semver = "1"
sha2 = "0.10"




[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Variant", "Win32_System_Com_StructuredStorage"] }

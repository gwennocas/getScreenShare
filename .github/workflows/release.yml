name: Release Windows and Linux

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) throw new Error("Release tag must match package.json version")'
      - run: npm ci
      - run: npm test
      - name: Check Windows audio module
        if: runner.os == 'Windows'
        run: node -e "require('node:fs').accessSync('node_modules/wasapi-loopback/prebuilds/windows-x86_64/wasapi-loopback-win32-x64.node')"
      - name: Build and upload release assets
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Check Rust release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $metadata = cargo metadata --manifest-path experiments/egui-probe/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json
          if ($env:RELEASE_TAG -ne "v$($metadata.packages[0].version)") { throw "Release tag must match the Rust package version" }
      - name: Build native Windows client
        run: cargo build --release --manifest-path experiments/egui-probe/Cargo.toml
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\gss-cargo
      - name: Upload executable and SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CARGO_TARGET_DIR: ${{ runner.temp }}\gss-cargo
        run: |
          $name = "getScreenShare-Rust-$env:RELEASE_TAG-windows-x86_64.exe"
          $asset = Join-Path $env:RUNNER_TEMP $name
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR 'release/getscreenshare-egui-probe.exe') $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$asset.sha256", $hash, [Text.UTF8Encoding]::new($false))
          gh release upload $env:RELEASE_TAG $asset "$asset.sha256" --clobber
